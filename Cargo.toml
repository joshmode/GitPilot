[workspace]
members = [
    "crates/gitpilot-core",
    "crates/gitpilot-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["GitPilot contributors"]
repository = "https://github.com/gitpilot/gitpilot"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
indexmap = "2.14.2"
parking_lot = "0.12.5"
regex = "1.12.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webbrowser = "1.2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

